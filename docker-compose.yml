version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smartpcb-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: smartpcb-ai-service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - AI_PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpcb-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FASTAPI_URL=http://ai-service:8000
      - MONGO_URI=mongodb://mongodb:27017/smartpcb_xai
      - JWT_SECRET=smartpcb-xai-super-secret-key-2026
    depends_on:
      - mongodb
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpcb-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
